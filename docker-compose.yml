services:
  db:
    image: postgres:17-alpine
    container_name: tutordesk-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tutordesk
      POSTGRES_PASSWORD: tutordesk
      POSTGRES_DB: tutordesk
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutordesk -d tutordesk"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
